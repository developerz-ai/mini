name: Shell checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Ensure ShellCheck is installed
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install --yes shellcheck

          fi
          shellcheck --version

      - name: Check Bash syntax
        shell: bash
        run: |
          for file in bin/mini lib/*.sh platforms/*.sh install.sh; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: shellcheck bin/mini lib/*.sh
