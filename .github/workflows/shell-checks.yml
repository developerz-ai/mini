name: Shell checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Ensure ShellCheck is installed
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install --yes shellcheck

          fi
          shellcheck --version

      - name: Check Bash syntax
        shell: bash
        run: |
          for file in bin/mini lib/*.sh platforms/*.sh install.sh; do
            bash -n "$file"
          done

      # -x makes ShellCheck follow what bin/mini sources at runtime
      # (${MINI_LIB}/…, ${MINI_PLATFORMS}/…); --source-path says where those
      # files live, so a moved or renamed one fails the build instead of
      # quietly dropping out of the check.
      #
      # SC2015 and SC2016 stay off: both are house idioms here — `a && b || c`
      # one-liners and single-quoted text carrying literal backticks. Every
      # other code is enforced, warnings and errors included.
      - name: Run ShellCheck
        shell: bash
        run: shellcheck -x --source-path=lib --source-path=platforms -e SC2015 -e SC2016 bin/mini lib/*.sh platforms/*.sh
