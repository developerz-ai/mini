name: Shell checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure ShellCheck is installed
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install --yes shellcheck

          fi
          shellcheck --version

      # The `bash -n` loop below is byte-for-byte what it always was, and the
      # ShellCheck step after it is untouched. What follows the loop is the
      # offline test suite, in the SAME step: this workflow must not grow a
      # second job or a second `run:` step, so the suite rides in the body of
      # a step that already existed.
      #
      # A member that exits nonzero aborts the step — GitHub's `bash` shell
      # runs with `-e` — so a red suite is a red `shell-checks` job, and
      # `shell-checks` is what .dz/maintainer/maintainer.yml
      # pr.required_checks names. A red suite therefore blocks the merge
      # instead of being ignored.
      #
      # Nothing here installs ollama or opencode, reads a credential or
      # reaches the network: every member script builds its own mktemp
      # sandbox and stubs what it must not touch.
      - name: Check Bash syntax and run the offline test suite
        shell: bash
        run: |
          for file in bin/mini lib/*.sh platforms/*.sh install.sh; do
            bash -n "$file"
          done

          # The suite. The runner decides by EXIT CODE alone and runs every
          # member even when an earlier one failed, so CI shows all the reds
          # at once instead of one per push. It also appends one PASS/FAIL
          # line per script to GITHUB_STEP_SUMMARY, which GitHub renders on
          # the run page.
          bash .github/run-tests.sh

          # Proves the runner can actually fail. A runner that always exited
          # 0 would make the suite above meaningless, and nothing else in
          # this workflow would notice: the deliberately failing member below
          # is driven through the SAME runner, and a zero exit from it means
          # a broken runner — so this step fails.
          #
          # GITHUB_STEP_SUMMARY is unset for this call only: the runner
          # appends a section per invocation, and a second section holding
          # the stub's deliberate "FAIL (exit 3)" would show a red line for
          # a script that is not a suite member, under the same heading as
          # the nine green ones.
          unset GITHUB_STEP_SUMMARY
          stub_dir="$(mktemp -d)"
          trap 'rm -rf "$stub_dir"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'echo "deliberate failure" >&2' 'exit 3' \
            > "${stub_dir}/failing_test.sh"
          chmod 0755 "${stub_dir}/failing_test.sh"
          if bash .github/run-tests.sh "${stub_dir}/failing_test.sh"; then
            echo "run-tests.sh exited 0 on a failing member" >&2
            exit 1
          fi
          echo "run-tests.sh correctly exited nonzero on a failing member"

          # The check above can only see the runner's exit status: a member
          # path that resolved to "no such file" would exit nonzero too, so a
          # broken runner would look green. This self-test pins the runner's
          # REPORTED VERDICT — that a member which ran and failed is reported
          # as "FAIL <label> (exit 3)", not as a missing file.
          bash .github/run-tests_test.sh

      # -x makes ShellCheck follow what bin/mini sources at runtime
      # (${MINI_LIB}/…, ${MINI_PLATFORMS}/…); --source-path says where those
      # files live, so a moved or renamed one fails the build instead of
      # quietly dropping out of the check.
      #
      # SC2015 and SC2016 stay off: both are house idioms here — `a && b || c`
      # one-liners and single-quoted text carrying literal backticks. Every
      # other code is enforced, warnings and errors included.
      - name: Run ShellCheck
        shell: bash
        run: shellcheck -x --source-path=lib --source-path=platforms -e SC2015 -e SC2016 bin/mini lib/*.sh platforms/*.sh install.sh
